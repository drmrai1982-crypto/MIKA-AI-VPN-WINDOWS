name: Windows Native Bridge Runtime Probe

on:
  push:
    paths:
      - ".github/workflows/windows-native-bridge-runtime-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Download native bridge artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43918971282 --repo drmrai1982-crypto/MIKA-AI-VPN-WINDOWS --name mika-native-bridge-windows-x64 --dir "$env:RUNNER_TEMP\mika-bridge"

      - name: Download HEV and FCAE runtime artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43916105641 --repo drmrai1982-crypto/MIKA-AI-VPN-WINDOWS --name mika-hev-windows-x64 --dir "$env:RUNNER_TEMP\mika-hev"

      - name: Load bridge, initialize FCAE, and inspect engines
        shell: pwsh
        run: |
          $bridge = Join-Path $env:RUNNER_TEMP "mika-bridge\MikaNativeBridge.dll"
          $ffiDir = Join-Path $env:RUNNER_TEMP "mika-hev\hev-engine"
          if (!(Test-Path $bridge)) { throw "Native bridge DLL was not downloaded: $bridge" }
          if (!(Test-Path (Join-Path $ffiDir "fcae_ffi.dll"))) { throw "FCAE DLL was not downloaded: $ffiDir" }

          @'
          import ctypes
          import pathlib
          import sys

          bridge_path = pathlib.Path(sys.argv[1])
          ffi_dir = pathlib.Path(sys.argv[2])
          bridge = ctypes.WinDLL(str(bridge_path))

          expected = bridge.mika_native_expected_abi
          expected.argtypes = []
          expected.restype = ctypes.c_uint32

          def bind(name):
              fn = getattr(bridge, name)
              fn.argtypes = [ctypes.c_wchar_p, ctypes.POINTER(ctypes.c_wchar), ctypes.c_uint32]
              fn.restype = ctypes.c_int32
              return fn

          expected_abi = expected()
          print(f"Header ABI expected by bridge: {expected_abi}")
          if expected_abi != 19:
              raise SystemExit(f"Unexpected header ABI: {expected_abi}")

          message = ctypes.create_unicode_buffer(2048)
          probe_result = bind("mika_native_probe")(str(ffi_dir), message, len(message))
          print(f"Probe result: {probe_result}")
          print(f"Probe message: {message.value}")
          if probe_result != 0:
              raise SystemExit(f"Native bridge probe failed with code {probe_result}")

          message.value = ""
          inspect_result = bind("mika_native_initialize_inspect")(str(ffi_dir), message, len(message))
          print(f"Initialize/inspect result: {inspect_result}")
          print("Runtime inspection report:")
          print(message.value)
          if inspect_result != 0:
              raise SystemExit(f"FCAE initialize/inspect failed with code {inspect_result}")
          if "FCAE initialized successfully" not in message.value:
              raise SystemExit("Initialization confirmation missing.")
          if "FCAE shutdown status: 0" not in message.value:
              raise SystemExit("Clean FCAE shutdown was not confirmed.")
          print("PASS: FCAE initialized, enumerated backend/TUN metadata, and shut down. No tunnel was started.")
          '@ | python - $bridge $ffiDir
