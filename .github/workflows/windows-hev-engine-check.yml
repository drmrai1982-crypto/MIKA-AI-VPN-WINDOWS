name: Windows HEV native engine build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-hev-engine-check.yml"
      - "UPSTREAM.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hev:
    name: Build HEV Windows DLL with MSYS2
    runs-on: windows-latest
    steps:
      - name: Checkout Windows project
        uses: actions/checkout@v4

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: drmrai1982-crypto/MIKA-AI-VPN
          ref: 73de903180e5d54b004b4338ad11355b0faf8609
          path: upstream-source
          persist-credentials: false

      - name: Install MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            make
            gcc
            binutils

      - name: Build Windows HEV engine DLL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd upstream-source/app/src/main/cpp/hev

          # The upstream checkout omits its optional Wintun third-party directory.
          # Supply the official API header expected by the upstream Makefile.
          mkdir -p third-part/wintun/include
          curl -fsSL https://raw.githubusercontent.com/WireGuard/wintun/master/api/wintun.h -o third-part/wintun/include/wintun.h
          test -s third-part/wintun/include/wintun.h

          # This source selects its Windows Wintun/IOCP implementation under __MSYS__.
          # The MSYS environment is intentional; MinGW-only compilation is not equivalent.
          make tp-static shared

          ENGINE="$PWD/bin/libhev-socks5-tunnel.so"
          test -s "$ENGINE"

          export LD_LIBRARY_PATH="$PWD/third-part/yaml/bin:$PWD/third-part/lwip/bin:$PWD/third-part/hev-task-system/bin:/usr/bin"
          ldd "$ENGINE" | tee "$GITHUB_WORKSPACE/hev-ldd.txt"
          ! grep -q "not found" "$GITHUB_WORKSPACE/hev-ldd.txt"

          STAGE="$GITHUB_WORKSPACE/hev-engine"
          mkdir -p "$STAGE"
          cp "$ENGINE" "$STAGE/libhev-socks5-tunnel.dll"

          # Collect the non-Windows runtime dependencies reported by ldd.
          sed -nE 's/.*=> ([^ ]+).*/\1/p; s/^([^ ]+) \(.*/\1/p' "$GITHUB_WORKSPACE/hev-ldd.txt" |
            grep '^/' | sort -u |
            while IFS= read -r dep; do
              case "$dep" in
                /c/Windows/*|/C/Windows/*) continue ;;
              esac
              if [ -f "$dep" ]; then cp -f "$dep" "$STAGE/"; fi
            done

          test -s "$STAGE/libhev-socks5-tunnel.dll"
          test -s "$STAGE/msys-2.0.dll"
          objdump -p "$STAGE/libhev-socks5-tunnel.dll" | grep "DLL Name"

      - name: Verify native DLL loading and bridge exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'hev-engine'
          if (-not (Test-Path (Join-Path $dir 'libhev-socks5-tunnel.dll'))) { throw 'HEV DLL missing' }
          if (-not (Test-Path (Join-Path $dir 'msys-2.0.dll'))) { throw 'MSYS runtime missing' }

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeLoaderCheck {
              [DllImport("kernel32", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern bool SetDllDirectory(string path);
              [DllImport("kernel32", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern IntPtr LoadLibrary(string path);
              [DllImport("kernel32", CharSet=CharSet.Ansi, SetLastError=true)]
              public static extern IntPtr GetProcAddress(IntPtr module, string name);
          }
          '@

          if (-not [NativeLoaderCheck]::SetDllDirectory($dir)) { throw "SetDllDirectory failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          $msys = [NativeLoaderCheck]::LoadLibrary((Join-Path $dir 'msys-2.0.dll'))
          if ($msys -eq [IntPtr]::Zero) { throw "LoadLibrary(msys-2.0.dll) failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          $init = [NativeLoaderCheck]::GetProcAddress($msys, 'msys_dll_init')
          if ($init -eq [IntPtr]::Zero) { throw 'msys_dll_init export missing' }
          $initDelegate = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer($init, [Action])
          $initDelegate.Invoke()

          $engine = [NativeLoaderCheck]::LoadLibrary((Join-Path $dir 'libhev-socks5-tunnel.dll'))
          if ($engine -eq [IntPtr]::Zero) { throw "LoadLibrary(HEV) failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          $required = @('hev_socks5_tunnel_main_from_str', 'hev_socks5_tunnel_quit', 'hev_socks5_tunnel_stats')
          foreach ($symbol in $required) {
            if ([NativeLoaderCheck]::GetProcAddress($engine, $symbol) -eq [IntPtr]::Zero) { throw "Required bridge export missing: $symbol" }
            Write-Host "FOUND $symbol"
          }
          Write-Host 'HEV DLL loaded successfully in a native Windows process.'

      - name: Install Rust stable for Windows x64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download official Wintun runtime DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'wintun-sdk'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll = Get-ChildItem -Path $extract -Filter 'wintun.dll' -Recurse | Where-Object { $_.Directory.Name -eq 'amd64' } | Select-Object -First 1
          if (-not $dll) { throw 'Official x64 Wintun DLL was not found in the SDK archive.' }
          if ($dll.Length -lt 65536) { throw 'Wintun DLL is unexpectedly small.' }
          "WINTUN_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified Wintun x64 DLL: $($dll.FullName) ($($dll.Length) bytes)"

      - name: Build upstream FFI with the real HEV Windows bridge
        shell: pwsh
        working-directory: upstream-source/core/fcae-ffi
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FCAE_HEV_DLL = Join-Path $env:GITHUB_WORKSPACE 'hev-engine/libhev-socks5-tunnel.dll'
          if (-not (Test-Path $env:FCAE_HEV_DLL)) { throw 'Built HEV DLL is missing.' }
          rustc --version
          # Emit a native Windows DLL for the desktop host as well as the static library.
          $manifest = Join-Path $PWD 'ffi/Cargo.toml'
          $manifestText = Get-Content $manifest -Raw
          if (-not $manifestText.Contains('crate-type = ["staticlib"]')) { throw 'Unexpected upstream FFI crate-type; refusing manifest rewrite.' }
          $manifestText = $manifestText.Replace('crate-type = ["staticlib"]', 'crate-type = ["staticlib", "cdylib"]')
          Set-Content -Path $manifest -Value $manifestText -Encoding utf8
          cargo build -p fcae-ffi --release --no-default-features --features "aether hev tun fcae-bridge-tun2socks/stub" --target x86_64-pc-windows-msvc
          $release = Join-Path $PWD 'target/x86_64-pc-windows-msvc/release'
          $lib = Join-Path $release 'fcae_ffi.lib'
          $dll = Join-Path $release 'fcae_ffi.dll'
          if (-not (Test-Path $lib)) { throw 'HEV-enabled Windows FFI static library was not produced.' }
          if (-not (Test-Path $dll)) { throw 'Windows desktop C ABI DLL was not produced.' }
          Copy-Item $dll (Join-Path $env:GITHUB_WORKSPACE 'hev-engine/fcae_ffi.dll') -Force
          Write-Host "HEV-enabled Windows FFI static library built: $lib"
          Write-Host "Windows desktop C ABI DLL staged: $dll"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class FcaeDllCheck {
              [DllImport("kernel32", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern bool SetDllDirectory(string path);
              [DllImport("kernel32", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern IntPtr LoadLibrary(string path);
              [DllImport("kernel32", CharSet=CharSet.Ansi, SetLastError=true)]
              public static extern IntPtr GetProcAddress(IntPtr module, string name);
          }
          '@
          $stage = Join-Path $env:GITHUB_WORKSPACE 'hev-engine'
          if (-not [FcaeDllCheck]::SetDllDirectory($stage)) { throw 'Could not set native DLL search directory.' }
          $module = [FcaeDllCheck]::LoadLibrary((Join-Path $stage 'fcae_ffi.dll'))
          if ($module -eq [IntPtr]::Zero) { throw "Could not load fcae_ffi.dll: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          foreach ($symbol in @('fcae_init','fcae_config_default','fcae_start','fcae_stop','fcae_last_error')) {
            if ([FcaeDllCheck]::GetProcAddress($module, $symbol) -eq [IntPtr]::Zero) { throw "Required C ABI export missing: $symbol" }
            Write-Host "FOUND C ABI export $symbol"
          }
          Write-Host 'MIKA FCAE C ABI DLL loaded successfully in native Windows.'

      - name: Upload HEV engine and runtime dependencies
        uses: actions/upload-artifact@v4
        with:
          name: mika-hev-windows-x64
          path: |
            hev-engine/*
            hev-ldd.txt
          if-no-files-found: error
