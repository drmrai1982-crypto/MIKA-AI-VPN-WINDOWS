name: Windows desktop shell build

on:
  push:
    branches: [main, "packaging/self-contained-win-x64"]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-desktop:
    name: Build WPF desktop app with native diagnostics (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Windows project
        uses: actions/checkout@v4

      - name: Download native bridge and FCAE runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nativeDir = "desktop/MikaAiVpn.Desktop/native-runtime"
          $bridgeDir = Join-Path $env:RUNNER_TEMP "mika-bridge"
          $hevDir = Join-Path $env:RUNNER_TEMP "mika-hev"
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null

          gh run download 43919889136 --repo drmrai1982-crypto/MIKA-AI-VPN-WINDOWS --name mika-native-bridge-windows-x64 --dir $bridgeDir
          gh run download 43916105641 --repo drmrai1982-crypto/MIKA-AI-VPN-WINDOWS --name mika-hev-windows-x64 --dir $hevDir

          $bridgeDll = Join-Path $bridgeDir "MikaNativeBridge.dll"
          $engineDir = Join-Path $hevDir "hev-engine"
          if (!(Test-Path $bridgeDll)) { throw "Native bridge artifact is incomplete." }
          if (!(Test-Path (Join-Path $engineDir "fcae_ffi.dll"))) { throw "FCAE runtime artifact is incomplete." }

          Copy-Item $bridgeDll $nativeDir -Force
          Copy-Item $engineDir (Join-Path $nativeDir "hev-engine") -Recurse -Force

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore desktop/MikaAiVpn.Desktop/MikaAiVpn.Desktop.csproj --runtime win-x64

      - name: Publish Windows x64 application
        run: dotnet publish desktop/MikaAiVpn.Desktop/MikaAiVpn.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/windows-x64

      - name: Validate self-contained output and package installer guidance
        shell: pwsh
        run: |
          $publish = "artifacts/windows-x64"
          $required = @(
            "MIKA-AI-VPN.exe",
            "MIKA-AI-VPN.dll",
            "coreclr.dll",
            "hostpolicy.dll",
            "PresentationFramework.dll",
            "MikaNativeBridge.dll",
            "hev-engine/fcae_ffi.dll",
            "hev-engine/libhev-socks5-tunnel.dll",
            "hev-engine/msys-2.0.dll"
          )
          foreach ($file in $required) {
            if (!(Test-Path (Join-Path $publish $file))) { throw "Publish output is missing $file" }
          }
          $runtimeConfig = Get-Content (Join-Path $publish "MIKA-AI-VPN.runtimeconfig.json") -Raw
          if ($runtimeConfig -match '"frameworks"') { throw "Publish is still framework-dependent; expected self-contained runtime config." }
          Copy-Item "desktop/installer/INSTALL.ps1" (Join-Path $publish "INSTALL.ps1") -Force
          Copy-Item "desktop/installer/README-FA.txt" (Join-Path $publish "README-FA.txt") -Force

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v4
        with:
          name: mika-ai-vpn-windows-x64
          path: artifacts/windows-x64/
          if-no-files-found: error
