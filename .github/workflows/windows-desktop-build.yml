name: Windows desktop shell build

on:
  push:
    branches: [main, "ui/radar-neon-node-network"]
    paths:
      - "desktop/**"
      - "scripts/**"
      - ".github/workflows/windows-desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-desktop:
    name: Build WPF desktop app with native diagnostics (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Windows project
        uses: actions/checkout@v4

      - name: Download native bridge and FCAE runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nativeDir = "desktop/MikaAiVpn.Desktop/native-runtime"
          $bridgeDir = Join-Path $env:RUNNER_TEMP "mika-bridge"
          $hevDir = Join-Path $env:RUNNER_TEMP "mika-hev"
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null

          gh run download 43919889136 --repo drmrai1982-crypto/MIKA-AI-VPN-WINDOWS --name mika-native-bridge-windows-x64 --dir $bridgeDir
          gh run download 43916105641 --repo drmrai1982-crypto/MIKA-AI-VPN-WINDOWS --name mika-hev-windows-x64 --dir $hevDir

          $bridgeDll = Join-Path $bridgeDir "MikaNativeBridge.dll"
          $engineDir = Join-Path $hevDir "hev-engine"
          if (!(Test-Path $bridgeDll)) { throw "Native bridge artifact is incomplete." }
          if (!(Test-Path (Join-Path $engineDir "fcae_ffi.dll"))) { throw "FCAE runtime artifact is incomplete." }

          Copy-Item $bridgeDll $nativeDir -Force
          Copy-Item $engineDir (Join-Path $nativeDir "hev-engine") -Recurse -Force

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore desktop/MikaAiVpn.Desktop/MikaAiVpn.Desktop.csproj

      - name: Publish Windows x64 application
        run: dotnet publish desktop/MikaAiVpn.Desktop/MikaAiVpn.Desktop.csproj --configuration Release --no-restore --output artifacts/windows-x64

      - name: Set up Python for Earth texture renderer
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare high-resolution NASA Blue Marble daytime texture with country borders
        shell: pwsh
        run: |
          $assets = "artifacts/windows-x64/assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $source = Join-Path $env:RUNNER_TEMP "nasa-blue-marble-source.jpg"
          $texture = Join-Path $assets "earth-day.jpg"
          Invoke-WebRequest -Uri "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/january/world.200401.3x21600x10800.jpg" -OutFile $source
          if (!(Test-Path $source) -or (Get-Item $source).Length -lt 500000) {
            throw "NASA Blue Marble daytime source texture is missing or unexpectedly small."
          }
          python -m pip install --quiet pillow
          python scripts/prepare-earth-texture.py --input $source --output $texture
          if (!(Test-Path $texture) -or (Get-Item $texture).Length -lt 500000) {
            throw "Enhanced daytime Earth texture is missing or unexpectedly small."
          }
          @"
          NASA Blue Marble: Next Generation (January 2004)
          Source imagery: NASA Earth Observatory / Blue Marble Next Generation.
          Cartographic borders and island outlines: Natural Earth 1:50m cultural dataset (public domain).
          NASA source page: https://science.nasa.gov/earth/earth-observatory/blue-marble-next-generation/base-map/
          Natural Earth source: https://github.com/nvkelso/natural-earth-vector
          The enhanced image is bundled locally for offline display after installation.
          "@ | Set-Content -Path (Join-Path $assets "SOURCE.txt") -Encoding UTF8
      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v4
        with:
          name: mika-ai-vpn-windows-x64
          path: artifacts/windows-x64/
          if-no-files-found: error
